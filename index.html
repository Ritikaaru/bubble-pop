<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bubble Pop!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body {
    height:100%; overflow:hidden;
    font-family:"Arial Rounded MT Bold","Arial Rounded MT",Arial,Helvetica,sans-serif;
    background:linear-gradient(to bottom,#87CEEB 0%,#B0E0F6 45%,#E0F6FF 100%);
    touch-action:manipulation; user-select:none; -webkit-user-select:none;
  }
  #game { position:fixed; inset:0; overflow:hidden; }

  .bubble {
    position:absolute; bottom:-140px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; cursor:pointer;
    box-shadow:inset -8px -8px 18px rgba(255,255,255,.35), inset 8px 8px 18px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.15);
    animation:rise linear forwards; will-change:transform;
    transition:transform .08s ease;
  }
  .bubble::after {
    content:""; position:absolute; top:16%; left:20%;
    width:28%; height:22%; border-radius:50%;
    background:rgba(255,255,255,.6); filter:blur(1px);
  }
  .bubble.blank {
    background:radial-gradient(circle at 35% 30%, rgba(255,255,255,.7), rgba(135,206,235,.35) 60%, rgba(120,190,225,.3));
    border:2px solid rgba(255,255,255,.5);
  }
  @media (hover:hover){ .bubble:hover{ transform:scale(1.08); } }
  .bubble.pop { animation:none; transform:scale(1.4); opacity:0; transition:transform .18s ease, opacity .18s ease; }

  @keyframes rise {
    from { transform:translateY(0) translateX(0); }
    to   { transform:translateY(-115vh) translateX(var(--drift,0px)); }
  }

  .particle {
    position:absolute; border-radius:50%; pointer-events:none; will-change:transform,opacity;
    animation:burst .6s ease-out forwards;
  }
  @keyframes burst {
    from { transform:translate(0,0) scale(1); opacity:1; }
    to   { transform:translate(var(--px),var(--py)) scale(.2); opacity:0; }
  }

  #score {
    position:fixed; top:14px; right:16px; z-index:20;
    background:rgba(255,255,255,.85); color:#0077aa;
    padding:8px 18px; border-radius:22px; font-size:24px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
  }

  #controls {
    position:fixed; bottom:16px; left:0; right:0; z-index:20;
    display:flex; gap:14px; justify-content:center;
  }
  #controls button {
    font-family:inherit; font-weight:bold; border:none; cursor:pointer;
    border-radius:26px; padding:14px 22px; font-size:18px; color:#fff;
    box-shadow:0 4px 10px rgba(0,0,0,.2); transition:transform .1s;
  }
  #controls button:active{ transform:scale(.94); }
  #restartBtn{ background:linear-gradient(135deg,#ff8fb1,#ff5f8f); }
  #voiceBtn{ background:linear-gradient(135deg,#7ec8ff,#4a9fe0); font-size:22px; padding:14px 20px; }

  #overlay {
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.4);
    display:none; align-items:center; justify-content:center;
  }
  #overlay.show{ display:flex; }
  #modal {
    background:#fff; border-radius:22px; padding:24px; width:min(92vw,420px);
    max-height:88vh; overflow-y:auto; box-shadow:0 10px 40px rgba(0,0,0,.3);
    transform:scale(.7); opacity:0; transition:transform .25s ease, opacity .25s ease;
  }
  #overlay.show #modal{ transform:scale(1); opacity:1; }
  #modal h2{ color:#4a9fe0; text-align:center; margin-bottom:16px; font-size:24px; }
  #modal label{ display:block; margin:14px 0 6px; color:#555; font-size:15px; }
  #modal select, #modal input[type=range]{ width:100%; }
  #modal select{ padding:10px; border-radius:12px; border:2px solid #cfe6f5; font-family:inherit; font-size:15px; background:#f5fbff; }
  .val{ color:#4a9fe0; font-weight:bold; }
  #testBtn{ width:100%; margin-top:18px; padding:12px; border:none; border-radius:14px; background:linear-gradient(135deg,#ffd36e,#ffb347); color:#7a5200; font-family:inherit; font-weight:bold; font-size:16px; cursor:pointer; }
  #doneBtn{ width:100%; margin-top:12px; padding:16px; border:none; border-radius:16px; background:linear-gradient(135deg,#5fd68a,#37b86a); color:#fff; font-family:inherit; font-weight:bold; font-size:20px; cursor:pointer; box-shadow:0 4px 12px rgba(55,184,106,.4); }
  #testBtn:active,#doneBtn:active{ transform:scale(.97); }
</style>
</head>
<body>
<div id="game"></div>
<div id="score">⭐ 0</div>

<div id="controls">
  <button id="restartBtn">🔄 New Bubbles!</button>
  <button id="voiceBtn">🎙️</button>
</div>

<div id="overlay">
  <div id="modal">
    <h2>🎙️ Voice Settings</h2>
    <label for="voiceSel">Voice</label>
    <select id="voiceSel"></select>
    <label>Speed: <span class="val" id="rateVal">1.0</span>x</label>
    <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1">
    <label>Pitch: <span class="val" id="pitchVal">1.0</span></label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
    <button id="testBtn">🔊 Test Voice</button>
    <button id="doneBtn">✓ Done</button>
  </div>
</div>

<script>
(function(){
  const game=document.getElementById('game');
  const scoreEl=document.getElementById('score');
  const overlay=document.getElementById('overlay');
  const voiceSel=document.getElementById('voiceSel');
  const rate=document.getElementById('rate'), pitch=document.getElementById('pitch');
  const rateVal=document.getElementById('rateVal'), pitchVal=document.getElementById('pitchVal');

  let score=0, paused=false;
  const MAX=10;
  const colors=['#e74c3c','#2ecc71','#3498db','#f1c40f','#ff79c6','#00d0d0','#e67e22','#9b59b6'];

  // ---------- Audio ----------
  let actx;
  function audio(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
  function popSound(){
    try{
      const c=audio(); if(c.state==='suspended') c.resume();
      const o=c.createOscillator(), g=c.createGain();
      o.type='sine'; o.frequency.setValueAtTime(600,c.currentTime);
      o.frequency.exponentialRampToValueAtTime(100,c.currentTime+0.15);
      g.gain.setValueAtTime(0.3,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+0.15);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime+0.15);
    }catch(e){}
  }

  // ---------- Speech ----------
  let voices=[], speaking=false, queue=[], voiceTries=0;
  function loadVoices(){
    voices=speechSynthesis.getVoices();
    if(!voices.length){
      // Chrome populates voices asynchronously; retry a few times.
      if(voiceTries++<20) setTimeout(loadVoices,250);
      return;
    }
    const prev=voiceSel.value;
    voiceSel.innerHTML='';
    const google=voices.filter(v=>/google/i.test(v.name)).sort((a,b)=>(/rishi/i.test(b.name)?1:0)-(/rishi/i.test(a.name)?1:0));
    const eng=voices.filter(v=>/en/i.test(v.lang)&&!/google/i.test(v.name));
    const other=voices.filter(v=>!/en/i.test(v.lang)&&!/google/i.test(v.name));
    function grp(label,list){
      if(!list.length) return;
      const og=document.createElement('optgroup'); og.label=label;
      list.forEach(v=>{ const o=document.createElement('option'); o.value=v.name; o.textContent=v.name+' ('+v.lang+')'; og.appendChild(o); });
      voiceSel.appendChild(og);
    }
    grp('Google Voices',google); grp('English Voices',eng); grp('Other Languages',other);
    if(prev && voices.some(v=>v.name===prev)) voiceSel.value=prev;
    else if(google.length) voiceSel.value=google[0].name;
  }
  speechSynthesis.onvoiceschanged=loadVoices; loadVoices();

  function speakNext(){
    if(speaking||!queue.length) return;
    const text=queue.shift(); speaking=true;
    const u=new SpeechSynthesisUtterance(text);
    const v=voices.find(x=>x.name===voiceSel.value); if(v) u.voice=v;
    u.rate=parseFloat(rate.value); u.pitch=parseFloat(pitch.value);
    u.onend=u.onerror=()=>{ setTimeout(()=>{ speaking=false; speakNext(); },1000); };
    speechSynthesis.speak(u);
  }
  function enqueue(text){ queue.push(text); if(queue.length>3) queue.shift(); setTimeout(speakNext,150); }

  // ---------- Bubbles ----------
  function spawn(){
    if(paused) return;
    if(game.querySelectorAll('.bubble').length>=MAX) return;
    const size=60+Math.random()*40;
    const b=document.createElement('div');
    b.className='bubble';
    b.style.width=b.style.height=size+'px';
    b.style.left=Math.random()*(window.innerWidth-size)+'px';
    b.style.setProperty('--drift',(Math.random()*80-40)+'px');
    const dur=7+Math.random()*5;
    b.style.animationDuration=dur+'s';

    const isBlank=Math.random()<0.5;
    if(isBlank){ b.classList.add('blank'); }
    else{
      let content, speech;
      if(Math.random()<0.5){ const c=String.fromCharCode(65+Math.floor(Math.random()*26)); content=c; speech=c; }
      else{ const n=1+Math.floor(Math.random()*10); content=n; speech=''+n; }
      b.textContent=content;
      b.dataset.speech=speech;
      b.style.fontSize=(size*0.45)+'px';
      b.style.background=colors[Math.floor(Math.random()*colors.length)];
      b.style.color='#fff';
      b.style.textShadow='1px 1px 3px rgba(0,0,0,.3)';
    }
    b.addEventListener('animationend',()=>b.remove());
    game.appendChild(b);
  }

  function burst(x,y){
    for(let i=0;i<10;i++){
      const p=document.createElement('div');
      p.className='particle';
      const s=6+Math.random()*8;
      p.style.width=p.style.height=s+'px';
      p.style.left=x+'px'; p.style.top=y+'px';
      p.style.background=colors[Math.floor(Math.random()*colors.length)];
      const a=Math.random()*Math.PI*2, d=40+Math.random()*50;
      p.style.setProperty('--px',Math.cos(a)*d+'px');
      p.style.setProperty('--py',Math.sin(a)*d+'px');
      game.appendChild(p);
      p.addEventListener('animationend',()=>p.remove());
    }
  }

  function pop(b,x,y){
    if(b.classList.contains('pop')) return;
    popSound();
    const r=b.getBoundingClientRect();
    burst(x||r.left+r.width/2, y||r.top+r.height/2);
    b.classList.add('pop');
    setTimeout(()=>b.remove(),200);
    score++; scoreEl.textContent='⭐ '+score;
    if(b.dataset.speech) enqueue(b.dataset.speech);
  }

  function handle(e){
    if(paused) return;
    const b=e.target.closest('.bubble');
    if(!b) return;
    e.preventDefault();
    const t=e.changedTouches?e.changedTouches[0]:e;
    pop(b,t.clientX,t.clientY);
  }
  game.addEventListener('touchstart',handle,{passive:false});
  game.addEventListener('mousedown',handle);
  document.addEventListener('contextmenu',e=>{ if(e.target.closest('#game')) e.preventDefault(); });

  // ---------- Controls ----------
  document.getElementById('restartBtn').addEventListener('click',()=>{
    game.querySelectorAll('.bubble,.particle').forEach(el=>el.remove());
    score=0; scoreEl.textContent='⭐ 0';
    audio();
  });
  document.getElementById('voiceBtn').addEventListener('click',()=>{ overlay.classList.add('show'); paused=true; audio(); });
  document.getElementById('doneBtn').addEventListener('click',()=>{ overlay.classList.remove('show'); paused=false; });
  overlay.addEventListener('click',e=>{ if(e.target===overlay){ overlay.classList.remove('show'); paused=false; } });
  document.getElementById('testBtn').addEventListener('click',()=>{ queue=[]; speaking=false; speechSynthesis.cancel(); enqueue('Hello! Let us play.'); });
  rate.addEventListener('input',()=>rateVal.textContent=parseFloat(rate.value).toFixed(1));
  pitch.addEventListener('input',()=>pitchVal.textContent=parseFloat(pitch.value).toFixed(1));

  document.addEventListener('visibilitychange',()=>{ if(document.hidden) paused=true; else if(!overlay.classList.contains('show')) paused=false; });

  setInterval(spawn,900);
  for(let i=0;i<4;i++) setTimeout(spawn,i*400);
})();
</script>
</body>
</html>
